<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Your Marks - Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="page-container">
        <div class="registration-container">
            <div class="registration-header">
                <h1>Enter Semester Marks</h1>
                <p>Please provide your marks for the first 5 semesters.</p>
            </div>
            <hr class="divider">
            <form id="marks-form" class="registration-form">
                <!-- We will build this form out in a future step -->
                <p style="text-align: center; color: var(--text-secondary);">
                    Thank you for registering! The form to enter your marks will be implemented here.
                </p>
                <p style="text-align: center;">
                    <a href="login.html" class="btn-primary" style="text-decoration: none; display: inline-block; width: auto; padding: 14px 28px;">Proceed to Login</a>
                </p>
            </form>
        </div>
    </div>
</body>
</html>
